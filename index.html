<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <style>
section{
    	background-color: rgb(131, 161, 124);
    	padding: 20px;
    	border-radius: 12px;
    	width: 600px;
    	margin: auto;
    	box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1,p{
    	text-align: center;
    }
    body, #submit, #movie, #review{
       font-family: 'Courier New', Courier, monospace; 
    }
    input[type="text"], select, textarea, button {
    	width: 94%;
    	padding: 15px;
    	border: 1px solid #ccc;
    	border-radius: 5px;
    	text-align: center;
    }
    #review{
        width: 4; height: 50px;
    }
    body{
        background-color: rgb(240, 220, 202);
    }
    
    </style>
</head>
<body>
    <header>
        <h1>MOVIE RATING</h1>
        <br>
        <p>Enjoyed a movie? Share your thoughts! Answer the rating form below.</p>
    </header>
    <br>
    <section>
    <form>
        <img style="display: block; height: 150px; width: 200px; margin: 0 auto;" src="https://static.vecteezy.com/system/resources/thumbnails/011/835/324/small/pair-of-black-movie-tickets-png.png" alt="logo">
        <br>  
        <label for="movie">Movie title</label>
        <br>
        <input type="text" id="movie" name="movie" placeholder="Type here...">
        <br>
        <br>
        <label for="genre">Genre</label>
        <br>
        <input type="checkbox" id="genre1" name="genre1">
            <label for="genre1">Action</label>
        <input type="checkbox" id="genre2" name="genre2">
            <label for="genre2">Romance</label>
        <input type="checkbox" id="genre3" name="genre3">
            <label for="genre3">Comedy</label>
        <input type="checkbox" id="genre4" name="genre4">
            <label for="genre4">Horror</label>
        <input type="checkbox" id="genre5" name="genre5">
            <label for="genre5">Sci-Fi</label>    
        <br>
        <br>
     <label for="rate">Rating</label>
        <br>
        <input type="radio" id="rate1" name="rate">
            <label for="rate">⭐️</label>
        <input type="radio" id="rate2" name="rate">
            <label for="rate">⭐️⭐️</label>
        <input type="radio" id="rate3" name="rate">
            <label for="rate">⭐️⭐️⭐️</label>
        <input type="radio" id="rate4" name="rate">
            <label for="rate">⭐️⭐️⭐️⭐️</label>
        <input type="radio" id="rate5" name="rate">
            <label for="rate">⭐️⭐️⭐️⭐️⭐️</label>

            <br>
            <br>

            <input type="text" id="review" name="review" placeholder="Write a review...">

            <br>
            <br>
            <input type="submit" id="submit" value="Submit Review">

            <br>
            <br>
            Click <a href="https://www.clickthecity.com/movies/now-showing" target="_blank">here</a> to see the now showing movies.
    </form>
    </section>

<p>coded by erich</p>
    
</body>
</html>
